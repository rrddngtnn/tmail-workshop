name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: node scripts/hygiene.mjs
      - run: npm ci --include=dev
      - run: npm audit --include=dev
      - run: npm audit --omit=dev
      - run: npm test
      - run: docker compose config --quiet
        env:
          TMAIL_INGEST_TOKEN: configuration-only-placeholder
          MAILBOX_TOKENS: configuration-only-placeholder
      - run: node scripts/container-smoke.mjs
